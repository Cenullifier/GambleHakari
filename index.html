<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gojo vs Sukuna Battle</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}

.bar {
  width: 320px;
  height: 22px;
  background: #333;
  margin: 10px auto;
  border-radius: 10px;
  overflow: hidden;
}

.hp {
  height: 100%;
  background: #22c55e;
  transition: 0.2s;
}

.enemy {
  background: #ef4444;
}

button {
  margin: 5px;
  padding: 10px 14px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#winScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#winScreen img {
  max-width: 500px;
  border-radius: 10px;
}

#log {
  margin-top: 15px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  height: 140px;
  overflow-y: auto;
  text-align: left;
}
</style>
</head>

<body>

<h1>Gojo vs Sukuna</h1>

<h2>Gojo HP</h2>
<div class="bar"><div id="gojoHP" class="hp"></div></div>

<h2>Sukuna HP</h2>
<div class="bar"><div id="sukunaHP" class="hp enemy"></div></div>

<div>
  <button onclick="attack('Blue')">Blue</button>
  <button onclick="attack('Red')">Red</button>
  <button onclick="attack('Purple')">Purple</button>
  <button onclick="attack('Punch')">Punch</button>
  <button onclick="domain()">Unlimited Void</button>
</div>

<div id="log"></div>

<!-- WIN SCREEN -->
<div id="winScreen">
  <h1 id="winnerText"></h1>
  <img id="winnerImg">
</div>

<script>

// ===== IMAGES =====
// Put these files in the SAME folder as this HTML

const GOJO_WIN_IMAGE = "gojo_win.jpg";     // first image you sent (Gojo wins)
const SUKUNA_WIN_IMAGE = "sukuna_win.jpg"; // second image you sent (Sukuna wins)

// ===== STATS =====
let gojo = 200;
let sukuna = 250;

// ===== UI =====
function updateBars() {
  document.getElementById("gojoHP").style.width = (gojo/200)*100 + "%";
  document.getElementById("sukunaHP").style.width = (sukuna/250)*100 + "%";
}

function log(text) {
  let box = document.getElementById("log");
  box.innerHTML += "<div>" + text + "</div>";
  box.scrollTop = box.scrollHeight;
}

// ===== ATTACKS =====
function attack(move) {
  if (gojo <= 0 || sukuna <= 0) return;

  let dmg = {
    Blue: 30,
    Red: 40,
    Purple: 60,
    Punch: 15
  }[move];

  // Sukuna dodge system
  let chance = Math.random();

  if (chance < 0.2) {
    dmg = 0;
    log("Sukuna dodged!");
  } else if (chance < 0.4) {
    dmg *= 0.5;
  }

  dmg = Math.round(dmg);
  sukuna -= dmg;

  log("Gojo used " + move + " for " + dmg);

  enemyTurn();
  checkWin();
  updateBars();
}

// ===== DOMAIN =====
function domain() {
  if (gojo <= 0 || sukuna <= 0) return;

  if (Math.random() < 0.25) {
    log("DOMAIN CLASH!");
    gojo -= 50;
    sukuna -= 50;
  } else {
    log("Gojo used Unlimited Void!");
    sukuna -= 100;
  }

  enemyTurn();
  checkWin();
  updateBars();
}

// ===== ENEMY AI =====
function enemyTurn() {
  if (sukuna <= 0) return;

  let moves = [
    {name:"Slash", dmg:25},
    {name:"Cleave", dmg:35},
    {name:"Dismantle", dmg:30}
  ];

  let move = moves[Math.floor(Math.random()*moves.length)];
  let dmg = move.dmg;

  if (Math.random() < 0.2) dmg = 0;

  gojo -= dmg;

  log("Sukuna used " + move.name + " for " + dmg);
}

// ===== WIN SYSTEM =====
function checkWin() {
  if (sukuna <= 0) {
    sukuna = 0;
    showWin("Gojo");
  }

  if (gojo <= 0) {
    gojo = 0;
    showWin("Sukuna");
  }
}

function showWin(winner) {
  document.getElementById("winScreen").style.display = "flex";

  if (winner === "Gojo") {
    document.getElementById("winnerText").innerText = "GOJO WINS";
    document.getElementById("winnerImg").src = GOJO_WIN_IMAGE;
  } else {
    document.getElementById("winnerText").innerText = "SUKUNA WINS";
    document.getElementById("winnerImg").src = SUKUNA_WIN_IMAGE;
  }
}

updateBars();

</script>

</body>
</html>
