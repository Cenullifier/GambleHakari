<!DOCTYPE html>
<html>
<head>
<title>Gojo vs Sukuna Battle</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
}

.bar {
    width: 320px;
    height: 22px;
    background: #333;
    margin: 10px auto;
    border-radius: 10px;
    overflow: hidden;
}

.hp {
    height: 100%;
    background: #22c55e;
}

.enemy {
    background: #ef4444;
}

button {
    margin: 5px;
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#log {
    margin: 15px auto;
    max-width: 500px;
    background: #1e293b;
    padding: 10px;
    border-radius: 10px;
    height: 140px;
    overflow-y: auto;
    text-align: left;
}

#winScreen,
#clash,
#shrine {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#winScreen img {
    max-width: 500px;
    max-height: 70vh;
    border-radius: 10px;
}

#clashBar {
    width: 300px;
    height: 25px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

#clashFill {
    width: 0%;
    height: 100%;
    background: #22c55e;
}

#shrineBar {
    width: 300px;
    height: 25px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
}

#shrineFill {
    width: 0%;
    height: 100%;
    background: #ef4444;
}
</style>
</head>

<body>

<h1>Gojo vs Sukuna Battle</h1>

<h2>Gojo</h2>
<div class="bar">
    <div id="gojoHP" class="hp"></div>
</div>
<p id="gojoText">200 / 200</p>

<h2>Sukuna</h2>
<div class="bar">
    <div id="sukunaHP" class="hp enemy"></div>
</div>
<p id="sukunaText">250 / 250</p>

<div>
    <button onclick="attack('Blue')">Blue</button>
    <button onclick="attack('Red')">Red</button>
    <button onclick="attack('Purple')">Hollow Purple</button>
    <button onclick="attack('Punch')">Punch</button>
    <button id="domainButton" onclick="gojoDomain()">Unlimited Void</button>
    <button id="rctButton" onclick="rct()">RCT</button>
</div>

<p id="cooldowns"></p>

<div id="log"></div>


<!-- WIN SCREEN -->

<div id="winScreen">
    <img id="winnerImg">
    <br>
    <button onclick="restart()">Restart</button>
</div>


<!-- DOMAIN CLASH -->

<div id="clash">
    <h1>DOMAIN CLASH</h1>
    <p>Tap SPACE as fast as you can!</p>

    <div id="clashBar">
        <div id="clashFill"></div>
    </div>

    <p id="clashText">0 / 100</p>
</div>


<!-- MALEVOLENT SHRINE -->

<div id="shrine">
    <h1>MALEVOLENT SHRINE</h1>
    <p>Tap SPACE 15-18 times to survive!</p>

    <div id="shrineBar">
        <div id="shrineFill"></div>
    </div>

    <p id="shrineText">0 / 15</p>
</div>


<script>

let gojo = 200;
let sukuna = 250;

const GOJO_MAX = 200;
const SUKUNA_MAX = 250;

let purpleCooldown = 0;
let domainCooldown = 0;
let rctCooldown = 0;

let sukunaDomainCooldown = 0;

let stunned = false;
let busy = false;

let clashActive = false;
let clashPower = 0;
let sukunaClashPower = 0;

let shrineActive = false;
let shrineNeeded = 15;
let shrinePresses = 0;

let shrineDamageTimer;


// WIN IMAGES
const GOJO_WIN_IMAGES = [
    "./gojo_win.jpg",
    "./gojo_win.jpeg",
    "./gojo_win.png",
    "./gojo_win.webp"
];

const SUKUNA_WIN_IMAGES = [
    "./sukuna_win.jpg",
    "./sukuna_win.jpeg",
    "./sukuna_win.png",
    "./sukuna_win.webp"
];


// LOG

function log(text) {
    let box = document.getElementById("log");

    box.innerHTML += text + "<br>";
    box.scrollTop = box.scrollHeight;
}


// HP BARS

function updateBars() {

    document.getElementById("gojoHP").style.width =
        (gojo / GOJO_MAX * 100) + "%";

    document.getElementById("sukunaHP").style.width =
        (sukuna / SUKUNA_MAX * 100) + "%";

    document.getElementById("gojoText").innerText =
        gojo + " / " + GOJO_MAX;

    document.getElementById("sukunaText").innerText =
        sukuna + " / " + SUKUNA_MAX;

    document.getElementById("cooldowns").innerText =
        "Purple: " + purpleCooldown +
        "s | Domain: " + domainCooldown +
        "s | RCT: " + rctCooldown + "s";
}


// DAMAGE

function damage(amount, target) {

    // 10% MISS
    if (Math.random() < 0.10) {
        log(target + " missed!");
        return;
    }

    if (target === "Gojo") {
        gojo -= amount;
        if (gojo < 0) gojo = 0;
        log("Sukuna dealt " + amount + " damage.");
    }

    if (target === "Sukuna") {
        sukuna -= amount;
        if (sukuna < 0) sukuna = 0;
        log("Gojo dealt " + amount + " damage.");
    }

    updateBars();
    checkWin();
}


// GOJO ATTACKS

function attack(move) {

    if (busy || stunned || shrineActive || clashActive) return;

    let damageAmount = 0;

    if (move === "Blue") {
        damageAmount = 15;
    }

    if (move === "Red") {
        damageAmount = 20;
    }

    if (move === "Punch") {
        damageAmount = 8;
    }

    if (move === "Purple") {

        if (purpleCooldown > 0) {
            log("Hollow Purple is on cooldown.");
            return;
        }

        purpleCooldown = 12;

        // HOLLOW NUKE UNDER 25% HP
        if (gojo <= GOJO_MAX * 0.25) {
            damageAmount = 55;
            log("GOJO USED HOLLOW NUKE!");
        } else {
            damageAmount = 30;
            log("Gojo used Hollow Purple!");
        }
    }

    damage(damageAmount, "Sukuna");

    if (sukuna <= 0) return;

    setTimeout(enemyTurn, 600);
}


// UNLIMITED VOID

function gojoDomain() {

    if (busy || stunned || shrineActive || clashActive) return;

    if (domainCooldown > 0) {
        log("Unlimited Void is on cooldown.");
        return;
    }

    domainCooldown = 20;

    // 25% CHANCE OF DOMAIN CLASH
    if (Math.random() < 0.25) {
        startClash();
        return;
    }

    // SOMETIMES DOMAIN DOESN'T ACTIVATE
    if (Math.random() < 0.20) {
        log("Unlimited Void failed to activate.");
        setTimeout(enemyTurn, 600);
        return;
    }

    // 10% MISS
    if (Math.random() < 0.10) {
        log("Unlimited Void missed!");
        setTimeout(enemyTurn, 600);
        return;
    }

    log("Unlimited Void hit!");
    sukuna -= 40;

    if (sukuna < 0) sukuna = 0;

    updateBars();

    if (sukuna <= 0) return;

    stunSukuna();
}


// STUN

function stunSukuna() {

    stunned = true;

    log("Sukuna is stunned for 2.5 seconds!");

    setTimeout(function() {

        stunned = false;

        if (sukuna > 0) {
            log("Sukuna recovered.");
            enemyTurn();
        }

    }, 2500);
}


// DOMAIN CLASH

function startClash() {

    busy = true;
    clashActive = true;

    clashPower = 0;
    sukunaClashPower = 0;

    document.getElementById("clash").style.display = "flex";

    document.getElementById("clashFill").style.width = "0%";
    document.getElementById("clashText").innerText = "0 / 100";

    log("DOMAIN CLASH!");

    let timer = 5000;
    let interval = setInterval(function() {

        if (!clashActive) {
            clearInterval(interval);
            return;
        }

        // SUKUNA FIGHTS BACK
        sukunaClashPower += Math.floor(Math.random() * 4) + 1;

        if (sukunaClashPower > 100)
            sukunaClashPower = 100;

        if (clashPower >= 100 || sukunaClashPower >= 100) {

            clearInterval(interval);
            endClash();
        }

        timer -= 100;

        if (timer <= 0) {
            clearInterval(interval);
            endClash();
        }

    }, 100);
}


// SPACE FOR DOMAIN CLASH

document.addEventListener("keydown", function(event) {

    if (event.code !== "Space") return;

    if (clashActive && !event.repeat) {

        clashPower += 8;

        if (clashPower > 100)
            clashPower = 100;

        document.getElementById("clashFill").style.width =
            clashPower + "%";

        document.getElementById("clashText").innerText =
            clashPower + " / 100";
    }

    if (shrineActive && !event.repeat) {

        shrinePresses++;

        if (shrinePresses > shrineNeeded)
            shrinePresses = shrineNeeded;

        document.getElementById("shrineFill").style.width =
            (shrinePresses / shrineNeeded * 100) + "%";

        document.getElementById("shrineText").innerText =
            shrinePresses + " / " + shrineNeeded;
    }
});


// END CLASH

function endClash() {

    clashActive = false;
    busy = false;

    document.getElementById("clash").style.display = "none";

    if (clashPower >= sukunaClashPower) {

        log("Gojo won the Domain Clash!");

        sukuna -= 40;

        if (sukuna < 0) sukuna = 0;

        updateBars();

        if (sukuna > 0)
            stunSukuna();

    } else {

        log("Sukuna won the Domain Clash!");

        startShrine();
    }
}


// MALEVOLENT SHRINE

function startShrine() {

    shrineActive = true;
    busy = true;

    shrineNeeded =
        Math.floor(Math.random() * 4) + 15;

    shrinePresses = 0;

    document.getElementById("shrine").style.display = "flex";

    document.getElementById("shrineFill").style.width = "0%";

    document.getElementById("shrineText").innerText =
        "0 / " + shrineNeeded;

    log("Malevolent Shrine activated!");

    // DAMAGE EVERY 3 SECONDS

    shrineDamageTimer = setInterval(function() {

        if (!shrineActive) return;

        damage(15, "Gojo");

    }, 3000);

    setTimeout(endShrine, 2500);
}


// END SHRINE SURVIVAL

function endShrine() {

    if (!shrineActive) return;

    shrineActive = false;
    busy = false;

    clearInterval(shrineDamageTimer);

    document.getElementById("shrine").style.display = "none";

    if (shrinePresses >= shrineNeeded) {

        log("Gojo survived Malevolent Shrine!");

    } else {

        log("Gojo failed to survive Malevolent Shrine!");

        gojo -= 35;

        if (gojo < 0) gojo = 0;

        updateBars();

        if (gojo <= 0) return;
    }

    setTimeout(enemyTurn, 600);
}


// SUKUNA TURN

function enemyTurn() {

    if (gojo <= 0 || sukuna <= 0) return;

    if (stunned || shrineActive || clashActive) return;

    // SUKUNA DOMAIN
    if (
        sukunaDomainCooldown <= 0 &&
        Math.random() < 0.18
    ) {

        sukunaDomain();
        return;
    }

    // SUKUNA RCT
    if (
        sukuna < SUKUNA_MAX * 0.45 &&
        Math.random() < 0.20
    ) {

        sukunaRCT();
        return;
    }

    let moves = [
        ["Slash", 12],
        ["Cleave", 15],
        ["Dismantle", 13]
    ];

    let move =
        moves[Math.floor(Math.random() * moves.length)];

    log("Sukuna used " + move[0] + ".");

    damage(move[1], "Gojo");
}


// SUKUNA DOMAIN

function sukunaDomain() {

    sukunaDomainCooldown = 20;

    // DOMAIN FAILS SOMETIMES

    if (Math.random() < 0.20) {
        log("Malevolent Shrine failed to activate.");
        setTimeout(enemyTurn, 600);
        return;
    }

    // DOMAIN MISS

    if (Math.random() < 0.10) {
        log("Malevolent Shrine missed!");
        setTimeout(enemyTurn, 600);
        return;
    }

    log("Sukuna activated Malevolent Shrine!");

    startShrine();
}


// SUKUNA RCT

function sukunaRCT() {

    let heal =
        Math.floor(
            SUKUNA_MAX * (0.15 + Math.random() * 0.05)
        );

    sukuna += heal;

    if (sukuna > SUKUNA_MAX)
        sukuna = SUKUNA_MAX;

    log("Sukuna used RCT and healed " + heal + ".");

    updateBars();

    setTimeout(enemyTurn, 600);
}


// GOJO RCT

function rct() {

    if (busy || stunned || shrineActive || clashActive) return;

    if (rctCooldown > 0) {
        log("RCT is on cooldown.");
        return;
    }

    rctCooldown = 10;

    let heal =
        Math.floor(
            GOJO_MAX * (0.15 + Math.random() * 0.05)
        );

    gojo += heal;

    if (gojo > GOJO_MAX)
        gojo = GOJO_MAX;

    log("Gojo used RCT and healed " + heal + ".");

    updateBars();

    setTimeout(enemyTurn, 600);
}


// CHECK WIN

function checkWin() {

    if (gojo <= 0) {
        showWin("Sukuna");
        return true;
    }

    if (sukuna <= 0) {
        showWin("Gojo");
        return true;
    }

    return false;
}


// WIN SCREEN

function showWin(winner) {

    busy = true;

    clearInterval(shrineDamageTimer);

    document.getElementById("clash").style.display = "none";
    document.getElementById("shrine").style.display = "none";

    let img = document.getElementById("winnerImg");

    let images =
        winner === "Gojo"
        ? GOJO_WIN_IMAGES
        : SUKUNA_WIN_IMAGES;

    let i = 0;

    img.style.display = "none";

    function tryImage() {

        if (i >= images.length)
            return;

        img.src = images[i];

        i++;

    }

    img.onload = function() {
        img.style.display = "block";
    };

    img.onerror = tryImage;

    tryImage();

    document.getElementById("winScreen").style.display = "flex";
}


// RESTART

function restart() {

    location.reload();
}


// COOLDOWN TIMER

setInterval(function() {

    if (purpleCooldown > 0)
        purpleCooldown--;

    if (domainCooldown > 0)
        domainCooldown--;

    if (rctCooldown > 0)
        rctCooldown--;

    if (sukunaDomainCooldown > 0)
        sukunaDomainCooldown--;

    updateBars();

}, 1000);


// START

updateBars();

log("The battle begins!");

</script>

</body>
</html>
