<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gojo vs Sukuna Battle</title>


<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    background:
        radial-gradient(circle at top, #1e1b4b, #0f172a 55%, #020617);

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

    min-height: 100vh;

    overflow-x: hidden;
}


h1 {

    font-size: 40px;

    margin: 10px 0 25px;

    text-shadow:
        0 0 10px #7c3aed,
        0 0 25px #7c3aed;
}


h2 {

    margin: 10px 0 5px;

}


/* =========================================
   HP BARS
========================================= */

.bar {

    width: 380px;

    max-width: 90%;

    height: 28px;

    margin: 8px auto 18px;

    background: #222;

    border: 2px solid #555;

    border-radius: 15px;

    overflow: hidden;
}


.hp {

    height: 100%;

    width: 100%;

    transition: width 0.35s ease;
}


.gojoHP {

    background:
        linear-gradient(
            90deg,
            #1d4ed8,
            #60a5fa
        );
}


.sukunaHP {

    background:
        linear-gradient(
            90deg,
            #991b1b,
            #ef4444
        );
}


/* =========================================
   ATTACK BUTTONS
========================================= */

button {

    margin: 5px;

    padding: 12px 18px;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    color: white;

    font-weight: bold;

    font-size: 14px;

    transition:
        transform 0.15s,
        filter 0.15s;
}


button:hover:not(:disabled) {

    transform: scale(1.05);

    filter: brightness(1.2);
}


button:active:not(:disabled) {

    transform: scale(0.95);
}


button:disabled {

    background: #444 !important;

    color: #888;

    cursor: not-allowed;

}


.blue {

    background: #2563eb;
}


.red {

    background: #dc2626;
}


.purple {

    background: #7c3aed;
}


.punch {

    background: #475569;
}


.domain {

    background: #581c87;
}


.restart {

    background: #16a34a;

    font-size: 17px;

    padding: 12px 25px;
}


/* =========================================
   STATUS
========================================= */

#purpleStatus {

    margin: 12px auto;

    color: #c4b5fd;

    font-size: 14px;

    max-width: 700px;
}


#cooldowns {

    margin: 10px auto 15px;

    color: #94a3b8;

    font-size: 14px;

    max-width: 800px;
}


/* =========================================
   BATTLE LOG
========================================= */

#log {

    width: 620px;

    max-width: 95%;

    height: 190px;

    margin: 20px auto;

    padding: 12px;

    background: #1e293b;

    border: 1px solid #475569;

    border-radius: 10px;

    overflow-y: auto;

    text-align: left;

    line-height: 1.5;
}


.gojoText {

    color: #60a5fa;
}


.sukunaText {

    color: #f87171;
}


.specialText {

    color: #c084fc;
}


/* =========================================
   DAMAGE NUMBERS
========================================= */

.damage {

    position: fixed;

    font-size: 32px;

    font-weight: bold;

    pointer-events: none;

    z-index: 50;

    animation:
        damageFloat 0.9s forwards;
}


@keyframes damageFloat {

    from {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

    to {

        opacity: 0;

        transform:
            translateY(-80px)
            scale(1.3);

    }

}


/* =========================================
   SCREEN SHAKE
========================================= */

.shake {

    animation:
        screenShake 0.3s;
}


@keyframes screenShake {

    0%,
    100% {

        transform:
            translateX(0);

    }

    25% {

        transform:
            translateX(-8px);

    }

    50% {

        transform:
            translateX(8px);

    }

    75% {

        transform:
            translateX(-6px);

    }

}


/* =========================================
   OVERLAYS
========================================= */

.overlay {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.97);

    z-index: 200;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 20px;
}


/* =========================================
   DOMAIN CLASH
========================================= */

#domainClash h1 {

    font-size: 45px;

    color: #c084fc;

    text-shadow:
        0 0 15px #7c3aed,
        0 0 35px #7c3aed;
}


.clashContainer {

    width: 600px;

    max-width: 90%;
}


.clashLabel {

    font-weight: bold;

    margin-top: 15px;

    font-size: 18px;
}


.clashBar {

    width: 100%;

    height: 32px;

    background: #333;

    border-radius: 20px;

    overflow: hidden;

    margin: 7px 0 18px;

    border: 2px solid #555;
}


.clashFill {

    height: 100%;

    width: 0%;

    transition:
        width 0.05s linear;
}


#gojoClashBar {

    background:
        linear-gradient(
            90deg,
            #1d4ed8,
            #60a5fa
        );
}


#sukunaClashBar {

    background:
        linear-gradient(
            90deg,
            #991b1b,
            #ef4444
        );
}


#clashTimer {

    font-size: 42px;

    font-weight: bold;

    margin: 10px;
}


#spaceText {

    font-size: 20px;

    font-weight: bold;

    max-width: 700px;

    margin: 15px auto;
}


.small {

    font-size: 13px;

    color: #94a3b8;

    margin-top: 12px;
}


/* =========================================
   WIN SCREEN
========================================= */

#winScreen {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0, 0, 0, 0.98);

    z-index: 500;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    padding: 20px;
}


#winnerImg {

    display: none;

    width: 800px;

    max-width: 92vw;

    max-height: 75vh;

    object-fit: contain;

    border-radius: 12px;

    border: 3px solid #8b5cf6;

    box-shadow:
        0 0 20px #8b5cf6,
        0 0 50px #7c3aed;

    margin-bottom: 20px;
}


/*
   This is ONLY shown if the browser
   cannot find the image file.
*/

#imageError {

    display: none;

    color: #f87171;

    font-size: 18px;

    margin-bottom: 20px;

    max-width: 600px;

}


</style>

</head>


<body>


<h1>GOJO VS SUKUNA</h1>


<!-- =====================================
     GOJO HP
====================================== -->

<h2>Gojo HP</h2>

<div class="bar">

    <div
        id="gojoHP"
        class="hp gojoHP">
    </div>

</div>


<!-- =====================================
     SUKUNA HP
====================================== -->

<h2>Sukuna HP</h2>

<div class="bar">

    <div
        id="sukunaHP"
        class="hp sukunaHP">
    </div>

</div>


<!-- =====================================
     ATTACK BUTTONS
====================================== -->

<div>

    <button
        class="blue"
        onclick="attack('Blue')">

        Blue

    </button>


    <button
        class="red"
        onclick="attack('Red')">

        Red

    </button>


    <button
        class="purple"
        id="purpleButton"
        onclick="attack('Purple')">

        Hollow Purple

    </button>


    <button
        class="punch"
        onclick="attack('Punch')">

        Punch

    </button>


    <button
        class="domain"
        id="domainButton"
        onclick="gojoDomain()">

        Unlimited Void

    </button>

</div>


<div id="purpleStatus"></div>


<div id="cooldowns"></div>


<div id="log"></div>


<!-- =====================================
     DOMAIN CLASH SCREEN
====================================== -->

<div
    id="domainClash"
    class="overlay">


    <h1>
        DOMAIN CLASH
    </h1>


    <div id="clashTimer">
        5
    </div>


    <div class="clashContainer">


        <div class="clashLabel">
            GOJO
        </div>


        <div class="clashBar">

            <div
                id="gojoClashBar"
                class="clashFill">
            </div>

        </div>


        <div class="clashLabel">
            SUKUNA
        </div>


        <div class="clashBar">

            <div
                id="sukunaClashBar"
                class="clashFill">
            </div>

        </div>


    </div>


    <div id="spaceText">

        PRESS SPACE REPEATEDLY
        TO FILL GOJO'S BAR

    </div>


    <div class="small">

        Sukuna's AI is also fighting
        to win the domain clash.

    </div>


</div>


<!-- =====================================
     WIN SCREEN
====================================== -->

<div
    id="winScreen"
    class="overlay">


    <img
        id="winnerImg"
        src=""
        alt="Winner image">


    <div id="imageError">

        Victory image could not be loaded.
        Check that the image filename is
        exactly correct and is in the same
        folder as index.html.

    </div>


    <button
        class="restart"
        onclick="restartGame()">

        RESTART BATTLE

    </button>


</div>


<script>


/* =========================================
   IMAGE FILES
========================================= */

/*
   FIRST IMAGE YOU UPLOADED:
   Sukuna victory image

   SECOND IMAGE YOU UPLOADED:
   Gojo victory image

   Keep these files in the SAME folder
   as index.html.
*/

const GOJO_WIN_IMAGE =
    "./gojo_win.jpg";

const SUKUNA_WIN_IMAGE =
    "./sukuna_win.jpg";


/* =========================================
   GAME STATS
========================================= */

const MAX_GOJO_HP = 200;

const MAX_SUKUNA_HP = 250;


let gojo =
    MAX_GOJO_HP;


let sukuna =
    MAX_SUKUNA_HP;


let gameOver =
    false;


/* =========================================
   COOLDOWNS
========================================= */

const PURPLE_COOLDOWN =
    18;


const GOJO_DOMAIN_COOLDOWN =
    28;


const SUKUNA_DOMAIN_COOLDOWN =
    28;


let purpleCooldown =
    0;


let gojoDomainCooldown =
    0;


let sukunaDomainCooldown =
    0;


/* =========================================
   DOMAIN CLASH VARIABLES
========================================= */

let clashActive =
    false;


let clashTimer =
    5;


let gojoClashPower =
    0;


let sukunaClashPower =
    0;


let clashInterval =
    null;


let clashTimerInterval =
    null;


/* =========================================
   SOUND SYSTEM
========================================= */

let audioContext =
    null;


function startAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

}


function playSound(type) {

    startAudio();


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    let frequency =
        300;


    let duration =
        0.15;


    if (type === "hit") {

        frequency =
            180;

        duration =
            0.12;

    }


    if (type === "blue") {

        frequency =
            600;

        duration =
            0.25;

    }


    if (type === "red") {

        frequency =
            150;

        duration =
            0.25;

    }


    if (type === "purple") {

        frequency =
            700;

        duration =
            0.4;

    }


    if (type === "nuke") {

        frequency =
            70;

        duration =
            1;

    }


    if (type === "domain") {

        frequency =
            90;

        duration =
            0.8;

    }


    oscillator.frequency.value =
        frequency;


    oscillator.type =
        "sawtooth";


    gain.gain.setValueAtTime(
        0.13,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


/* =========================================
   UPDATE HP BARS
========================================= */

function updateBars() {

    document.getElementById(
        "gojoHP"
    ).style.width =

        Math.max(
            0,
            gojo /
            MAX_GOJO_HP *
            100
        ) + "%";


    document.getElementById(
        "sukunaHP"
    ).style.width =

        Math.max(
            0,
            sukuna /
            MAX_SUKUNA_HP *
            100
        ) + "%";


    updateCooldowns();

}


/* =========================================
   LOG
========================================= */

function log(
    text,
    className = ""
) {

    const box =
        document.getElementById(
            "log"
        );


    const line =
        document.createElement(
            "div"
        );


    line.className =
        className;


    line.innerHTML =
        text;


    box.appendChild(
        line
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =========================================
   DAMAGE NUMBERS
========================================= */

function showDamage(
    amount,
    target
) {

    const damage =
        document.createElement(
            "div"
        );


    damage.className =
        "damage";


    damage.innerText =
        amount === 0
        ? "MISS"
        : "-" + amount;


    damage.style.left =
        target === "sukuna"
        ? "65%"
        : "30%";


    damage.style.top =
        "40%";


    damage.style.color =
        amount === 0
        ? "white"
        : "#f87171";


    document.body.appendChild(
        damage
    );


    setTimeout(
        () => {

            damage.remove();

        },
        900
    );

}


/* =========================================
   SCREEN SHAKE
========================================= */

function shake() {

    const body =
        document.body;


    body.classList.remove(
        "shake"
    );


    void body.offsetWidth;


    body.classList.add(
        "shake"
    );

}


/* =========================================
   GOJO ATTACKS
========================================= */

function attack(move) {

    if (
        gameOver ||
        clashActive ||
        gojo <= 0 ||
        sukuna <= 0
    ) {

        return;

    }


    startAudio();


    const attacks = {

        Blue: 15,

        Red: 20,

        Punch: 8

    };


    let dmg;


    /* =====================================
       HOLLOW PURPLE
    ===================================== */

    if (
        move === "Purple"
    ) {


        if (
            purpleCooldown > 0
        ) {

            log(
                "Hollow Purple is still on cooldown.",
                "specialText"
            );

            return;

        }


        purpleCooldown =
            PURPLE_COOLDOWN;


        /*
           HOLLOW NUKE

           Activated when Gojo has
           25% HP or less.
        */

        if (
            gojo <=
            MAX_GOJO_HP * 0.25
        ) {

            dmg =
                75;


            playSound(
                "nuke"
            );


            log(
                "GOJO USED HOLLOW NUKE.",
                "specialText"
            );

        }


        /*
           NORMAL HOLLOW PURPLE
        */

        else {

            dmg =
                35;


            playSound(
                "purple"
            );


            log(
                "GOJO USED HOLLOW PURPLE.",
                "specialText"
            );

        }

    }


    else {

        dmg =
            attacks[move];


        if (
            move === "Blue"
        ) {

            playSound(
                "blue"
            );

        }

        else if (
            move === "Red"
        ) {

            playSound(
                "red"
            );

        }

        else {

            playSound(
                "hit"
            );

        }

    }


    /* =====================================
       GOJO ATTACK ACCURACY

       10% MISS
       12% PARTIAL BLOCK
    ===================================== */

    const dodge =
        Math.random();


    if (
        dodge < 0.10
    ) {

        dmg =
            0;


        log(
            "Sukuna dodged " +
            move + ".",
            "sukunaText"
        );

    }


    else if (
        dodge < 0.22
    ) {

        dmg =
            Math.round(
                dmg * 0.5
            );


        log(
            "Sukuna partially blocked " +
            move + ".",
            "sukunaText"
        );

    }


    /*
       Small critical chance.
    */

    else if (
        Math.random() < 0.10
    ) {

        dmg =
            Math.round(
                dmg * 1.5
            );


        log(
            "CRITICAL HIT.",
            "gojoText"
        );

    }


    sukuna -=
        dmg;


    sukuna =
        Math.max(
            0,
            sukuna
        );


    showDamage(
        dmg,
        "sukuna"
    );


    shake();


    log(
        "Gojo used <b>" +
        move +
        "</b> for <b>" +
        dmg +
        "</b> damage.",
        "gojoText"
    );


    updateBars();


    checkWin();


    if (!gameOver) {

        setTimeout(
            enemyTurn,
            650
        );

    }

}


/* =========================================
   GOJO DOMAIN
========================================= */

function gojoDomain() {

    if (
        gameOver ||
        clashActive
    ) {

        return;

    }


    if (
        gojoDomainCooldown > 0
    ) {

        log(
            "Unlimited Void is on cooldown.",
            "specialText"
        );

        return;

    }


    gojoDomainCooldown =
        GOJO_DOMAIN_COOLDOWN;


    playSound(
        "domain"
    );


    const choice =
        Math.random();


    /*
       35% chance Sukuna responds
       with Malevolent Shrine.
    */

    if (
        choice < 0.35 &&
        sukunaDomainCooldown <= 0
    ) {

        sukunaDomainCooldown =
            SUKUNA_DOMAIN_COOLDOWN;


        log(
            "SUKUNA ANSWERED WITH MALEVOLENT SHRINE. DOMAIN CLASH.",
            "specialText"
        );


        startDomainClash();


        return;

    }


    /*
       13% chance the domain
       fails to fully form.
    */

    if (
        choice < 0.48
    ) {

        log(
            "GOJO ATTEMPTED UNLIMITED VOID, BUT THE DOMAIN DID NOT FULLY FORM.",
            "specialText"
        );


        updateBars();


        setTimeout(
            enemyTurn,
            700
        );


        return;

    }


    /*
       Successful Unlimited Void.
    */

    const dmg =
        50;


    sukuna -=
        dmg;


    sukuna =
        Math.max(
            0,
            sukuna
        );


    showDamage(
        dmg,
        "sukuna"
    );


    log(
        "GOJO USED UNLIMITED VOID FOR " +
        dmg +
        " DAMAGE.",
        "specialText"
    );


    updateBars();


    checkWin();


    if (!gameOver) {

        setTimeout(
            enemyTurn,
            700
        );

    }

}


/* =========================================
   SUKUNA DOMAIN
========================================= */

function sukunaDomain() {

    if (
        gameOver ||
        clashActive ||
        sukuna <= 0 ||
        gojo <= 0
    ) {

        return;

    }


    if (
        sukunaDomainCooldown > 0
    ) {

        enemyTurn();

        return;

    }


    sukunaDomainCooldown =
        SUKUNA_DOMAIN_COOLDOWN;


    playSound(
        "domain"
    );


    /*
       Sukuna has a 35% chance
       to decide NOT to use
       his domain.
    */

    if (
        Math.random() < 0.35
    ) {

        log(
            "Sukuna chose not to use Malevolent Shrine.",
            "sukunaText"
        );


        enemyTurn();


        return;

    }


    /*
       If Gojo's domain is ready,
       Sukuna may trigger a clash.
    */

    if (
        gojoDomainCooldown <= 0 &&
        Math.random() < 0.45
    ) {

        gojoDomainCooldown =
            GOJO_DOMAIN_COOLDOWN;


        log(
            "GOJO ANSWERED WITH UNLIMITED VOID. DOMAIN CLASH.",
            "specialText"
        );


        startDomainClash();


        return;

    }


    /*
       Chance of Sukuna's domain
       failing.
    */

    if (
        Math.random() < 0.18
    ) {

        log(
            "Sukuna attempted Malevolent Shrine, but the domain did not fully form.",
            "sukunaText"
        );


        return;

    }


    /*
       Successful Malevolent Shrine.
    */

    const dmg =
        45;


    gojo -=
        dmg;


    gojo =
        Math.max(
            0,
            gojo
        );


    showDamage(
        dmg,
        "gojo"
    );


    log(
        "SUKUNA USED MALEVOLENT SHRINE FOR " +
        dmg +
        " DAMAGE.",
        "specialText"
    );


    updateBars();


    checkWin();

}


/* =========================================
   SUKUNA AI
========================================= */

function enemyTurn() {

    if (
        gameOver ||
        clashActive ||
        sukuna <= 0 ||
        gojo <= 0
    ) {

        return;

    }


    /*
       Chance for Sukuna to
       attempt his domain.
    */

    if (
        sukunaDomainCooldown <= 0 &&
        Math.random() < 0.16
    ) {

        sukunaDomain();


        return;

    }


    const moves = [

        {
            name: "Slash",
            dmg: 12
        },

        {
            name: "Cleave",
            dmg: 17
        },

        {
            name: "Dismantle",
            dmg: 14
        },

        {
            name: "Black Flash",
            dmg: 21
        }

    ];


    let move;


    /*
       Sukuna becomes more aggressive
       when Gojo has low HP.
    */

    if (
        gojo <= 60 &&
        Math.random() < 0.45
    ) {

        move =
            moves[3];

    }

    else {

        move =
            moves[
                Math.floor(
                    Math.random() * 3
                )
            ];

    }


    let dmg =
        move.dmg;


    /* =====================================
       SUKUNA ACCURACY

       10% MISS
       12% PARTIAL AVOID
    ===================================== */

    if (
        Math.random() < 0.10
    ) {

        dmg =
            0;


        log(
            "Gojo dodged " +
            move.name +
            ".",
            "gojoText"
        );

    }


    else if (
        Math.random() < 0.12
    ) {

        dmg =
            Math.round(
                dmg * 0.5
            );


        log(
            "Gojo partially avoided " +
            move.name +
            ".",
            "gojoText"
        );

    }


    /*
       Sukuna critical hit.
    */

    else if (
        Math.random() < 0.10
    ) {

        dmg =
            Math.round(
                dmg * 1.5
            );


        log(
            "SUKUNA CRITICAL HIT.",
            "sukunaText"
        );

    }


    gojo -=
        dmg;


    gojo =
        Math.max(
            0,
            gojo
        );


    showDamage(
        dmg,
        "gojo"
    );


    playSound(
        "hit"
    );


    log(
        "Sukuna used <b>" +
        move.name +
        "</b> for <b>" +
        dmg +
        "</b> damage.",
        "sukunaText"
    );


    updateBars();


    checkWin();

}


/* =========================================
   DOMAIN CLASH
========================================= */

function startDomainClash() {

    if (gameOver) {

        return;

    }


    clashActive =
        true;


    clashTimer =
        5;


    gojoClashPower =
        0;


    sukunaClashPower =
        0;


    document.getElementById(
        "gojoClashBar"
    ).style.width =
        "0%";


    document.getElementById(
        "sukunaClashBar"
    ).style.width =
        "0%";


    document.getElementById(
        "clashTimer"
    ).innerText =
        clashTimer;


    document.getElementById(
        "domainClash"
    ).style.display =
        "flex";


    /*
       Sukuna actively fights
       the Space-bar battle.
    */

    clashInterval =
        setInterval(
            function() {

                if (!clashActive) {

                    return;

                }


                /*
                   Sukuna's progress.
                */

                sukunaClashPower +=
                    1.1 +
                    Math.random() * 1.8;


                /*
                   Occasional stronger push.
                */

                if (
                    Math.random() < 0.08
                ) {

                    sukunaClashPower +=
                        3;

                }


                sukunaClashPower =
                    Math.min(
                        100,
                        sukunaClashPower
                    );


                document.getElementById(
                    "sukunaClashBar"
                ).style.width =
                    sukunaClashPower +
                    "%";


                if (
                    sukunaClashPower >= 100
                ) {

                    endDomainClash(
                        "Sukuna"
                    );

                }

            },
            100
        );


    /*
       Five-second countdown.
    */

    clashTimerInterval =
        setInterval(
            function() {

                if (!clashActive) {

                    return;

                }


                clashTimer--;


                document.getElementById(
                    "clashTimer"
                ).innerText =
                    clashTimer;


                if (
                    clashTimer <= 0
                ) {

                    endDomainClash();

                }

            },
            1000
        );

}


/* =========================================
   SPACE BAR DOMAIN CLASH
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code !== "Space" ||
            !clashActive
        ) {

            return;

        }


        event.preventDefault();


        /*
           Every SPACE press
           increases Gojo's bar.
        */

        gojoClashPower +=
            4 +
            Math.random() * 1.5;


        gojoClashPower =
            Math.min(
                100,
                gojoClashPower
            );


        document.getElementById(
            "gojoClashBar"
        ).style.width =
            gojoClashPower +
            "%";


        /*
           Gojo immediately wins
           if his bar reaches 100.
        */

        if (
            gojoClashPower >= 100
        ) {

            endDomainClash(
                "Gojo"
            );

        }

    }
);


/* =========================================
   END DOMAIN CLASH
========================================= */

function endDomainClash(
    forcedWinner = null
) {

    if (!clashActive) {

        return;

    }


    clashActive =
        false;


    clearInterval(
        clashInterval
    );


    clearInterval(
        clashTimerInterval
    );


    document.getElementById(
        "domainClash"
    ).style.display =
        "none";


    let winner;


    if (forcedWinner) {

        winner =
            forcedWinner;

    }

    else if (
        gojoClashPower >
        sukunaClashPower
    ) {

        winner =
            "Gojo";

    }

    else {

        winner =
            "Sukuna";

    }


    /*
       GOJO WINS THE CLASH
    */

    if (
        winner === "Gojo"
    ) {

        const dmg =
            60;


        sukuna -=
            dmg;


        sukuna =
            Math.max(
                0,
                sukuna
            );


        showDamage(
            dmg,
            "sukuna"
        );


        log(
            "GOJO WON THE DOMAIN CLASH. UNLIMITED VOID HIT FOR " +
            dmg +
            " DAMAGE.",
            "gojoText"
        );

    }


    /*
       SUKUNA WINS THE CLASH
    */

    else {

        const dmg =
            55;


        gojo -=
            dmg;


        gojo =
            Math.max(
                0,
                gojo
            );


        showDamage(
            dmg,
            "gojo"
        );


        log(
            "SUKUNA WON THE DOMAIN CLASH. MALEVOLENT SHRINE HIT FOR " +
            dmg +
            " DAMAGE.",
            "sukunaText"
        );

    }


    updateBars();


    checkWin();

}


/* =========================================
   WIN CHECK
========================================= */

function checkWin() {

    if (gameOver) {

        return;

    }


    /*
       GOJO WINS
    */

    if (
        sukuna <= 0
    ) {

        sukuna =
            0;


        gameOver =
            true;


        updateBars();


        showWin(
            "Gojo"
        );


        return;

    }


    /*
       SUKUNA WINS
    */

    if (
        gojo <= 0
    ) {

        gojo =
            0;


        gameOver =
            true;


        updateBars();


        showWin(
            "Sukuna"
        );


        return;

    }

}


/* =========================================
   SHOW WIN IMAGE
========================================= */

function showWin(winner) {

    const screen =
        document.getElementById(
            "winScreen"
        );


    const image =
        document.getElementById(
            "winnerImg"
        );


    const error =
        document.getElementById(
            "imageError"
        );


    /*
       Reset image state.
    */

    image.style.display =
        "none";


    error.style.display =
        "none";


    /*
       Choose the correct image.
    */

    let imagePath;


    if (
        winner === "Gojo"
    ) {

        imagePath =
            GOJO_WIN_IMAGE;

    }

    else {

        imagePath =
            SUKUNA_WIN_IMAGE;

    }


    /*
       IMPORTANT:

       The onload and onerror
       handlers are created BEFORE
       setting image.src.
    */

    image.onload =
        function() {

            image.style.display =
                "block";

            error.style.display =
                "none";

        };


    image.onerror =
        function() {

            image.style.display =
                "none";

            error.style.display =
                "block";

        };


    /*
       Load the victory image.
    */

    image.src =
        imagePath;


    /*
       Show the win screen.
    */

    screen.style.display =
        "flex";

}


/* =========================================
   RESTART GAME
========================================= */

function restartGame() {

    /*
       Reset HP.
    */

    gojo =
        MAX_GOJO_HP;


    sukuna =
        MAX_SUKUNA_HP;


    /*
       Reset cooldowns.
    */

    purpleCooldown =
        0;


    gojoDomainCooldown =
        0;


    sukunaDomainCooldown =
        0;


    /*
       Reset game state.
    */

    gameOver =
        false;


    clashActive =
        false;


    /*
       Stop domain timers.
    */

    clearInterval(
        clashInterval
    );


    clearInterval(
        clashTimerInterval
    );


    /*
       Hide screens.
    */

    document.getElementById(
        "winScreen"
    ).style.display =
        "none";


    document.getElementById(
        "domainClash"
    ).style.display =
        "none";


    /*
       Reset image.
    */

    document.getElementById(
        "winnerImg"
    ).style.display =
        "none";


    document.getElementById(
        "winnerImg"
    ).src =
        "";


    document.getElementById(
        "imageError"
    ).style.display =
        "none";


    /*
       Clear log.
    */

    document.getElementById(
        "log"
    ).innerHTML =
        "";


    /*
       Update everything.
    */

    updateBars();


    log(
        "THE BATTLE BEGINS.",
        "specialText"
    );

}


/* =========================================
   COOLDOWN DISPLAY
========================================= */

function updateCooldowns() {

    const purpleButton =
        document.getElementById(
            "purpleButton"
        );


    const domainButton =
        document.getElementById(
            "domainButton"
        );


    /*
       Disable buttons while
       they are on cooldown.
    */

    purpleButton.disabled =
        purpleCooldown > 0 ||
        gameOver ||
        clashActive;


    domainButton.disabled =
        gojoDomainCooldown > 0 ||
        gameOver ||
        clashActive;


    const purpleText =
        purpleCooldown > 0
        ? purpleCooldown + "s"
        : "READY";


    const gojoDomainText =
        gojoDomainCooldown > 0
        ? gojoDomainCooldown + "s"
        : "READY";


    const sukunaDomainText =
        sukunaDomainCooldown > 0
        ? sukunaDomainCooldown + "s"
        : "READY";


    document.getElementById(
        "cooldowns"
    ).innerText =

        "Hollow Purple: " +
        purpleText +

        " | Unlimited Void: " +
        gojoDomainText +

        " | Malevolent Shrine: " +
        sukunaDomainText;


    /*
       Purple status.
    */

    if (
        gojo <=
        MAX_GOJO_HP * 0.25
    ) {

        document.getElementById(
            "purpleStatus"
        ).innerText =

            "Gojo is at or below 25% HP: Hollow Purple becomes HOLLOW NUKE.";

    }

    else {

        document.getElementById(
            "purpleStatus"
        ).innerText =

            "Gojo is above 25% HP: Hollow Purple is in its normal form.";

    }

}


/* =========================================
   COOLDOWN TIMER
========================================= */

setInterval(
    function() {

        if (
            purpleCooldown > 0
        ) {

            purpleCooldown--;

        }


        if (
            gojoDomainCooldown > 0
        ) {

            gojoDomainCooldown--;

        }


        if (
            sukunaDomainCooldown > 0
        ) {

            sukunaDomainCooldown--;

        }


        updateCooldowns();

    },
    1000
);


/* =========================================
   INITIALIZE GAME
========================================= */

updateBars();


log(
    "THE BATTLE BEGINS.",
    "specialText"
);


</script>
