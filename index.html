```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gojo vs Sukuna Battle</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e1b4b);
  color: white;
  text-align: center;
  margin: 0;
  min-height: 100vh;
  padding: 20px;
}

h1 {
  font-size: 38px;
  text-shadow: 0 0 15px #8b5cf6;
}

h2 {
  margin-bottom: 5px;
}

/* ===== HP BARS ===== */

.bar {
  width: min(320px, 90%);
  height: 25px;
  background: #333;
  margin: 10px auto 20px;
  border-radius: 15px;
  overflow: hidden;
  border: 2px solid #555;
}

.hp {
  height: 100%;
  background: #22c55e;
  transition: width 0.4s ease;
}

.enemy {
  background: #ef4444;
}

/* ===== DAMAGE NUMBERS ===== */

.damage {
  position: fixed;
  font-size: 30px;
  font-weight: bold;
  pointer-events: none;
  animation: damageFloat 1s forwards;
  z-index: 50;
}

@keyframes damageFloat {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }

  100% {
    transform: translateY(-80px) scale(1.4);
    opacity: 0;
  }
}

/* ===== ATTACK BUTTONS ===== */

button {
  margin: 5px;
  padding: 11px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  color: white;
  background: #4f46e5;
  transition: 0.15s;
}

button:hover:not(:disabled) {
  transform: scale(1.08);
  filter: brightness(1.25);
}

button:active:not(:disabled) {
  transform: scale(0.95);
}

button:disabled {
  background: #555;
  color: #aaa;
  cursor: not-allowed;
}

.blue {
  background: #2563eb;
}

.red {
  background: #dc2626;
}

.purple {
  background: #9333ea;
}

.punch {
  background: #475569;
}

.domain {
  background: #7c3aed;
}

/* ===== COOLDOWNS ===== */

#cooldowns {
  margin-top: 10px;
  font-size: 14px;
  color: #c4b5fd;
}

/* ===== BATTLE ANIMATION ===== */

#battleArea {
  position: relative;
  max-width: 700px;
  margin: 20px auto;
  padding: 15px;
}

.attackFlash {
  animation: flash 0.35s;
}

@keyframes flash {
  0% {
    transform: scale(1);
    filter: brightness(1);
  }

  50% {
    transform: scale(1.05);
    filter: brightness(2);
  }

  100% {
    transform: scale(1);
    filter: brightness(1);
  }
}

.shake {
  animation: shake 0.35s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(10px); }
  60% { transform: translateX(-8px); }
  80% { transform: translateX(8px); }
  100% { transform: translateX(0); }
}

/* ===== LOG ===== */

#log {
  margin: 15px auto;
  max-width: 550px;
  background: #1e293b;
  padding: 12px;
  border-radius: 10px;
  height: 160px;
  overflow-y: auto;
  text-align: left;
  border: 1px solid #475569;
}

.logGojo {
  color: #60a5fa;
}

.logSukuna {
  color: #f87171;
}

.logSpecial {
  color: #c084fc;
}

/* ===== WIN SCREEN ===== */

#winScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  background: rgba(0,0,0,0.96);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 100;
  padding: 20px;
}

#winScreen h1 {
  font-size: 50px;
  margin-bottom: 20px;
}

#winnerImg {
  width: min(500px, 90vw);
  max-height: 60vh;
  object-fit: contain;
  border-radius: 15px;
  border: 3px solid #8b5cf6;
  box-shadow: 0 0 30px #8b5cf6;
}

#restartButton {
  margin-top: 25px;
  background: #16a34a;
  font-size: 18px;
  padding: 13px 25px;
}

/* fallback shown if image cannot load */
#imageFallback {
  display: none;
  font-size: 100px;
  padding: 40px;
}
</style>
</head>

<body>

<h1>⚔️ GOJO VS SUKUNA ⚔️</h1>

<div id="battleArea">

  <h2>🔵 Gojo HP</h2>
  <div class="bar">
    <div id="gojoHP" class="hp"></div>
  </div>

  <h2>🔴 Sukuna HP</h2>
  <div class="bar">
    <div id="sukunaHP" class="hp enemy"></div>
  </div>

  <!-- ATTACKS -->

  <div id="buttons">

    <button class="blue" onclick="attack('Blue')">
      🔵 Blue
    </button>

    <button class="red" onclick="attack('Red')">
      🔴 Red
    </button>

    <button class="purple" id="purpleButton" onclick="attack('Purple')">
      🟣 Hollow Purple
    </button>

    <button class="punch" onclick="attack('Punch')">
      👊 Punch
    </button>

    <button class="domain" id="domainButton" onclick="domain()">
      🌀 Unlimited Void
    </button>

  </div>

  <div id="cooldowns">
    Purple: Ready | Unlimited Void: Ready
  </div>

</div>

<div id="log"></div>


<!-- ===== WIN SCREEN ===== -->

<div id="winScreen">

  <h1 id="winnerText"></h1>

  <img
    id="winnerImg"
    src=""
    alt="Winner"
  >

  <div id="imageFallback"></div>

  <button id="restartButton" onclick="restartGame()">
    🔄 Restart Battle
  </button>

</div>


<script>

/* =====================================================
   IMAGE SETTINGS
   ===================================================== */

/*
   IMPORTANT:
   Put these two files in the SAME folder as this HTML.

   gojo_win.jpg
   sukuna_win.jpg
*/

const GOJO_WIN_IMAGE = "gojo_win.jpg";
const SUKUNA_WIN_IMAGE = "sukuna_win.jpg";


/* =====================================================
   GAME STATS
   ===================================================== */

const MAX_GOJO_HP = 200;
const MAX_SUKUNA_HP = 250;

let gojo = MAX_GOJO_HP;
let sukuna = MAX_SUKUNA_HP;

let gameOver = false;


/* =====================================================
   COOLDOWNS
   ===================================================== */

let purpleCooldown = 0;
let domainCooldown = 0;


/* =====================================================
   SOUND SYSTEM
   ===================================================== */

/*
   These sounds are generated by the browser.
   You don't need external sound files.
*/

let audioContext;

function startAudio() {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function playSound(type) {

  startAudio();

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  let frequency = 300;
  let duration = 0.15;

  if (type === "hit") {
    frequency = 180;
    duration = 0.12;
  }

  if (type === "blue") {
    frequency = 600;
    duration = 0.25;
  }

  if (type === "red") {
    frequency = 150;
    duration = 0.25;
  }

  if (type === "purple") {
    frequency = 800;
    duration = 0.5;
  }

  if (type === "domain") {
    frequency = 100;
    duration = 0.8;
  }

  if (type === "victory") {
    frequency = 700;
    duration = 1;
  }

  oscillator.frequency.value = frequency;
  oscillator.type = "sawtooth";

  gain.gain.setValueAtTime(0.15, audioContext.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration);
}


/* =====================================================
   UI
   ===================================================== */

function updateBars() {

  document.getElementById("gojoHP").style.width =
    Math.max(0, (gojo / MAX_GOJO_HP) * 100) + "%";

  document.getElementById("sukunaHP").style.width =
    Math.max(0, (sukuna / MAX_SUKUNA_HP) * 100) + "%";

}


/* =====================================================
   BATTLE LOG
   ===================================================== */

function log(text, type = "") {

  const box = document.getElementById("log");

  const div = document.createElement("div");

  div.className = type;

  div.innerHTML = text;

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;
}


/* =====================================================
   DAMAGE NUMBER
   ===================================================== */

function showDamage(amount, target) {

  const damage = document.createElement("div");

  damage.className = "damage";

  damage.innerText =
    amount === 0 ? "MISS!" : "-" + amount;

  damage.style.left =
    target === "sukuna"
      ? "65%"
      : "35%";

  damage.style.top = "40%";

  damage.style.color =
    amount === 0 ? "white" : "#f87171";

  document.body.appendChild(damage);

  setTimeout(() => {
    damage.remove();
  }, 1000);
}


/* =====================================================
   SCREEN SHAKE
   ===================================================== */

function screenShake() {

  const area = document.getElementById("battleArea");

  area.classList.remove("shake");

  void area.offsetWidth;

  area.classList.add("shake");
}


/* =====================================================
   ATTACKS
   ===================================================== */

function attack(move) {

  if (gameOver || gojo <= 0 || sukuna <= 0) {
    return;
  }

  startAudio();

  /*
     LOWER DAMAGE VALUES
  */

  const attacks = {

    Blue: 15,

    Red: 20,

    Purple: 35,

    Punch: 8

  };

  let dmg = attacks[move];

  /* Purple cooldown */

  if (move === "Purple") {

    if (purpleCooldown > 0) {

      log(
        "🟣 Hollow Purple is on cooldown!",
        "logSpecial"
      );

      return;
    }

    purpleCooldown = 3;

    playSound("purple");

    log(
      "🟣 <b>GOJO USED HOLLOW PURPLE!</b>",
      "logSpecial"
    );

  } else if (move === "Blue") {

    playSound("blue");

  } else if (move === "Red") {

    playSound("red");

  } else {

    playSound("hit");

  }


  /*
     SUKUNA DODGE SYSTEM

     20% complete dodge
     20% partial dodge
  */

  const chance = Math.random();

  if (chance < 0.20) {

    dmg = 0;

    log(
      "💨 Sukuna dodged " + move + "!",
      "logSukuna"
    );

  }

  else if (chance < 0.40) {

    dmg = Math.round(dmg * 0.5);

    log(
      "🛡️ Sukuna partially blocked " +
      move + "!",
      "logSukuna"
    );

  }


  dmg = Math.round(dmg);

  sukuna -= dmg;

  if (sukuna < 0) {
    sukuna = 0;
  }

  showDamage(dmg, "sukuna");

  screenShake();

  log(
    "🔵 Gojo used <b>" +
    move +
    "</b> for <b>" +
    dmg +
    "</b> damage.",
    "logGojo"
  );


  updateBars();

  checkWin();

  if (!gameOver) {

    setTimeout(() => {
      enemyTurn();
      checkWin();
      updateBars();
    }, 500);

  }

}


/* =====================================================
   UNLIMITED VOID
   ===================================================== */

function domain() {

  if (gameOver || gojo <= 0 || sukuna <= 0) {
    return;
  }

  startAudio();

  if (domainCooldown > 0) {

    log(
      "🌀 Unlimited Void is on cooldown!",
      "logSpecial"
    );

    return;
  }

  domainCooldown = 5;

  playSound("domain");

  const clash = Math.random() < 0.25;

  if (clash) {

    /*
       DOMAIN CLASH
       Reduced damage
    */

    gojo -= 25;
    sukuna -= 25;

    showDamage(25, "sukuna");

    log(
      "⚡ <b>DOMAIN CLASH!</b> Both fighters took 25 damage.",
      "logSpecial"
    );

  }

  else {

    /*
       Successful domain
       Much lower than original 100
    */

    const dmg = 50;

    sukuna -= dmg;

    showDamage(dmg, "sukuna");

    log(
      "🌀 <b>UNLIMITED VOID!</b> Sukuna takes 50 damage.",
      "logSpecial"
    );

  }


  gojo = Math.max(0, gojo);
  sukuna = Math.max(0, sukuna);

  screenShake();

  updateBars();

  checkWin();

  if (!gameOver) {

    setTimeout(() => {

      enemyTurn();

      checkWin();

      updateBars();

    }, 700);

  }

}


/* =====================================================
   SUKUNA AI
   ===================================================== */

function enemyTurn() {

  if (gameOver || sukuna <= 0 || gojo <= 0) {
    return;
  }


  const moves = [

    {
      name: "Slash",
      dmg: 12
    },

    {
      name: "Cleave",
      dmg: 17
    },

    {
      name: "Dismantle",
      dmg: 14
    },

    {
      name: "Black Flash",
      dmg: 22
    }

  ];


  /*
     Smarter AI:

     Sukuna has a chance to use
     stronger attacks when Gojo
     is getting low.
  */

  let move;

  if (gojo <= 60 && Math.random() < 0.5) {

    move = moves[3];

  } else {

    move =
      moves[Math.floor(Math.random() * 3)];

  }


  let dmg = move.dmg;


  /*
     Sukuna can also miss.
  */

  if (Math.random() < 0.15) {

    dmg = 0;

    log(
      "💨 Gojo dodged Sukuna's " +
      move.name + "!",
      "logGojo"
    );

  }


  gojo -= dmg;

  gojo = Math.max(0, gojo);

  showDamage(dmg, "gojo");

  playSound("hit");

  log(
    "🔴 Sukuna used <b>" +
    move.name +
    "</b> for <b>" +
    dmg +
    "</b> damage.",
    "logSukuna"
  );

}


/* =====================================================
   WIN SYSTEM
   ===================================================== */

function checkWin() {

  if (gameOver) {
    return;
  }


  if (sukuna <= 0) {

    sukuna = 0;

    gameOver = true;

    updateBars();

    showWin("Gojo");

    return;
  }


  if (gojo <= 0) {

    gojo = 0;

    gameOver = true;

    updateBars();

    showWin("Sukuna");

    return;
  }

}


/* =====================================================
   WIN SCREEN
   ===================================================== */

function showWin(winner) {

  const screen =
    document.getElementById("winScreen");

  const text =
    document.getElementById("winnerText");

  const img =
    document.getElementById("winnerImg");

  const fallback =
    document.getElementById("imageFallback");


  screen.style.display = "flex";

  playSound("victory");


  /*
     Set winner text
  */

  if (winner === "Gojo") {

    text.innerText = "🔵 GOJO WINS 🔵";

    img.src = GOJO_WIN_IMAGE;

    fallback.innerText = "🔵";
    fallback.style.color = "#60a5fa";

  }

  else {

    text.innerText = "🔴 SUKUNA WINS 🔴";

    img.src = SUKUNA_WIN_IMAGE;

    fallback.innerText = "🔴";
    fallback.style.color = "#ef4444";

  }


  /*
     IMPORTANT FIX:
     If the image cannot be found,
     hide the broken-image icon and
     show a fallback instead.
  */

  img.style.display = "block";
  fallback.style.display = "none";


  img.onerror = function() {

    console.log(
      "Winner image could not be loaded: " +
      img.src
    );

    img.style.display = "none";

    fallback.style.display = "block";

  };

}


/* =====================================================
   RESTART
   ===================================================== */

function restartGame() {

  gojo = MAX_GOJO_HP;
  sukuna = MAX_SUKUNA_HP;

  purpleCooldown = 0;
  domainCooldown = 0;

  gameOver = false;


  document.getElementById(
    "winScreen"
  ).style.display = "none";


  document.getElementById(
    "winnerImg"
  ).style.display = "block";


  document.getElementById(
    "imageFallback"
  ).style.display = "none";


  document.getElementById(
    "log"
  ).innerHTML = "";


  log(
    "⚔️ <b>THE BATTLE BEGINS!</b>",
    "logSpecial"
  );


  updateBars();

  updateCooldowns();

}


/* =====================================================
   COOLDOWN TIMER
   ===================================================== */

function updateCooldowns() {

  const purpleButton =
    document.getElementById("purpleButton");

  const domainButton =
    document.getElementById("domainButton");


  purpleButton.disabled =
    purpleCooldown > 0 || gameOver;

  domainButton.disabled =
    domainCooldown > 0 || gameOver;


  let purpleText =
    purpleCooldown > 0
      ? purpleCooldown + " turns"
      : "Ready";


  let domainText =
    domainCooldown > 0
      ? domainCooldown + " turns"
      : "Ready";


  document.getElementById(
    "cooldowns"
  ).innerText =
    "Purple: " +
    purpleText +
    " | Unlimited Void: " +
    domainText;

}


/*
   Cooldowns decrease every second.

   This gives the player time to use
   normal attacks while waiting.
*/

setInterval(() => {

  if (purpleCooldown > 0) {
    purpleCooldown--;
  }

  if (domainCooldown > 0) {
    domainCooldown--;
  }

  updateCooldowns();

}, 1000);


/* =====================================================
   START GAME
   ===================================================== */

updateBars();

updateCooldowns();

log(
  "⚔️ <b>THE BATTLE BEGINS!</b>",
  "logSpecial"
);

</script>

</body>
</html>
