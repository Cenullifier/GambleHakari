<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cenull Battle</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
}

h1 {
  margin: 20px;
}

.bar {
  width: 300px;
  height: 20px;
  background: #333;
  margin: 10px auto;
  border-radius: 10px;
  overflow: hidden;
}

.hp {
  height: 100%;
  background: #22c55e;
}

.enemy { background: #ef4444; }

button {
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.log {
  margin-top: 20px;
  max-width: 500px;
  margin-left: auto;
  margin-right: auto;
  background: #1e293b;
  padding: 10px;
  border-radius: 10px;
  height: 150px;
  overflow-y: auto;
  text-align: left;
}
</style>

</head>

<body>

<h1>⚔️ Gojo vs Sukuna</h1>

<h2>Gojo HP</h2>
<div class="bar"><div id="gojoHP" class="hp"></div></div>

<h2>Sukuna HP</h2>
<div class="bar"><div id="sukunaHP" class="hp enemy"></div></div>

<div>
  <button onclick="playerMove('Blue')">Blue (30 dmg)</button>
  <button onclick="playerMove('Red')">Red (40 dmg)</button>
  <button onclick="playerMove('Purple')">Hollow Purple (60 dmg)</button>
  <button onclick="playerMove('Punch')">Punch (15 dmg)</button>
</div>

<div class="log" id="log"></div>

<script>

let gojo = { hp: 200, max: 200 };
let sukuna = { hp: 250, max: 250 };

function updateBars() {
  document.getElementById("gojoHP").style.width = (gojo.hp/gojo.max)*100 + "%";
  document.getElementById("sukunaHP").style.width = (sukuna.hp/sukuna.max)*100 + "%";
}

function log(text) {
  const logBox = document.getElementById("log");
  logBox.innerHTML += "<div>" + text + "</div>";
  logBox.scrollTop = logBox.scrollHeight;
}

function playerMove(move) {
  if (gojo.hp <= 0 || sukuna.hp <= 0) return;

  let dmg = 0;

  if (move === "Blue") dmg = 30;
  if (move === "Red") dmg = 40;
  if (move === "Purple") dmg = 60;
  if (move === "Punch") dmg = 15;

  // Sukuna defense system
  let chance = Math.random();

  if (chance < 0.2) {
    log("Sukuna EVADED the attack!");
    dmg = 0;
  } else if (chance < 0.4) {
    log("Sukuna BLOCKED most of it!");
    dmg *= 0.5;
  } else if (chance < 0.6) {
    log("Sukuna TANKED it (-20%)");
    dmg *= 0.8;
  }

  dmg = Math.round(dmg);
  sukuna.hp -= dmg;

  log("Gojo used " + move + " for " + dmg + " damage!");

  if (sukuna.hp <= 0) {
    sukuna.hp = 0;
    updateBars();
    log("🔥 Sukuna defeated!");
    return;
  }

  enemyTurn();
  updateBars();
}

function enemyTurn() {
  let moves = [
    { name: "Slash", dmg: 25 },
    { name: "Cleave", dmg: 35 },
    { name: "Dismantle", dmg: 30 },
    { name: "Domain Hit", dmg: 45 }
  ];

  let move = moves[Math.floor(Math.random() * moves.length)];

  let dmg = move.dmg;

  // Gojo dodge chance
  if (Math.random() < 0.2) {
    log("Gojo dodged the attack!");
    dmg = 0;
  }

  gojo.hp -= dmg;

  log("Sukuna used " + move.name + " for " + dmg + " damage!");

  if (gojo.hp <= 0) {
    gojo.hp = 0;
    updateBars();
    log("💀 Gojo defeated!");
  }
}

updateBars();

</script>

</body>
</html>
